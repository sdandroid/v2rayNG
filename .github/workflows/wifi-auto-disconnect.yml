name: Build Wi-Fi auto-disconnect APK

on:
  push:
    branches:
      - master
      - fix/wifi-disconnect-regression
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare fixed signing keystore if configured
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" && -z "$APP_KEYSTORE_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fixed signing secrets are not configured. Will build a debug test APK only."
          elif [[ -z "$KEYSTORE_BASE64" || -z "$APP_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure BOTH APP_KEYSTORE_BASE64 and APP_KEYSTORE_PASSWORD in repository Actions Secrets."
            exit 1
          else
            umask 077
            KEYSTORE_PATH="$RUNNER_TEMP/v2rayng-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            keytool -list -keystore "$KEYSTORE_PATH" -storepass:env APP_KEYSTORE_PASSWORD -alias v2rayng > /dev/null
            echo "APP_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'

      - name: Install SDK and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"

      - name: Build native tun libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          export NDK_HOME="$ANDROID_NDK_HOME"
          ABIS=arm64-v8a bash compile-hevtun.sh
          cp -r libs V2rayNG/app/

      - name: Determine Xray library version
        run: |
          # Tags are needed to match the pinned AndroidLibXrayLite submodule revision.
          git -C AndroidLibXrayLite fetch --tags --force
          XRAY_TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)
          test -n "$XRAY_TAG"
          echo "XRAY_TAG=$XRAY_TAG" >> "$GITHUB_ENV"

      - name: Download Xray AAR
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.XRAY_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Assemble signed arm64-v8a release APK
        if: steps.signing.outputs.configured == 'true'
        run: |
          cd V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleFdroidRelease -PABI_FILTERS=arm64-v8a --stacktrace
          test "$(find app/build/outputs/apk/fdroid/release -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(find app/build/outputs/apk/fdroid/release -maxdepth 1 -name '*arm64-v8a*.apk' | wc -l)" -eq 1

      - name: Verify release APK signature
        if: steps.signing.outputs.configured == 'true'
        run: |
          APK=$(find V2rayNG/app/build/outputs/apk/fdroid/release -maxdepth 1 -name '*arm64-v8a*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload fixed-signature arm64-v8a APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-arm64-v8a-signed
          path: V2rayNG/app/build/outputs/apk/fdroid/release/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Assemble arm64-v8a test APK (secrets not configured)
        if: steps.signing.outputs.configured == 'false'
        run: |
          cd V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleFdroidDebug -PABI_FILTERS=arm64-v8a --stacktrace
          test "$(find app/build/outputs/apk/fdroid/debug -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(find app/build/outputs/apk/fdroid/debug -maxdepth 1 -name '*arm64-v8a*.apk' | wc -l)" -eq 1

      - name: Upload temporary debug-signature APK
        if: steps.signing.outputs.configured == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-arm64-v8a-debug-NOT-FIXED-SIGNED
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 7
